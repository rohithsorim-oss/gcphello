steps:
  # Build the application
  - name: 'gradle:9.7.1-jdk21'
    entrypoint: 'bash'
    args: ['-c', 'chmod +x ./gradlew && ./gradlew build']

  # Build and push Docker image with build ID
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gcphello:$BUILD_ID', '-t', 'gcr.io/$PROJECT_ID/gcphello:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gcphello:$BUILD_ID']

  # Deploy to Cloud Run (dev environment)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gcphello-$_ENV'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gcphello:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=$_ENV,APP_VERSION=$BUILD_ID'

substitutions:
  _ENV: 'dev'
  _REGION: 'asia-south1'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
